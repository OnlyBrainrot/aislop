name: Build Eclipse (Geode v6.0.0-alpha.2, Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          bindings: geode-sdk/bindings
          # bindings main as of the v6.0.0-alpha.2 release (2026-11-15)
          bindings-ref: 7a670e953f63de379722215b8d2fa4d95e1e3f75
          sdk: given
          cli: latest
          combine: true
          export-pdb: true
          build-config: RelWithDebInfo

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - name: Combine builds
        uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
